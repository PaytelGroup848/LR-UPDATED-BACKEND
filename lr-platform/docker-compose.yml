services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  guac-db:
    image: mysql:8.4
    container_name: lr-guac-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: guacamole_root
      MYSQL_DATABASE: guacamole_db
      MYSQL_USER: guacamole
      MYSQL_PASSWORD: guacamole
    volumes:
      - guac-db-data:/var/lib/mysql
      - ./guacamole/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uguacamole",
          "-pguacamole"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  guac-db-migrate:
    image: mysql:8.4
    restart: "no"
    environment:
      MYSQL_PWD: guacamole
    command:
      [
        "mysql",
        "--host=guac-db",
        "--user=guacamole",
        "guacamole_db",
        "--execute=source /migrations/upgrade-pre-1.6.0.sql"
      ]
    volumes:
      - ./guacamole/upgrade-pre-1.6.0.sql:/migrations/upgrade-pre-1.6.0.sql:ro
    depends_on:
      guac-db:
        condition: service_healthy

  guacd:
    image: guacamole/guacd:1.6.0
    container_name: lr-guacd
    restart: unless-stopped

  guacamole:
    build:
      context: .
      dockerfile: guacamole/Dockerfile
    image: lr-guacamole:1.6.0
    container_name: lr-guacamole
    restart: unless-stopped
    environment:
      GUACD_HOSTNAME: guacd
      MYSQL_HOSTNAME: guac-db
      MYSQL_DATABASE: guacamole_db
      MYSQL_USER: guacamole
      MYSQL_PASSWORD: guacamole
    ports:
      - "${GUACAMOLE_PORT:-8080}:8080"
    depends_on:
      guac-db:
        condition: service_healthy
      guac-db-migrate:
        condition: service_completed_successfully
      guacd:
        condition: service_started

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    image: lr-platform-api-gateway:latest
    container_name: lr-api-gateway
    restart: unless-stopped
    environment:
      AUTH_SERVICE_URL: http://auth-service:8001
      USER_SERVICE_URL: http://user-service:8002
      WEB_BACKEND_URL: http://web-backend:8004
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      UPSTREAM_MAX_CONNECTIONS: ${UPSTREAM_MAX_CONNECTIONS:-2000}
      UPSTREAM_MAX_KEEPALIVE: ${UPSTREAM_MAX_KEEPALIVE:-500}
    ports:
      - "${API_GATEWAY_PORT:-8000}:8000"
    depends_on:
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      web-backend:
        condition: service_healthy

  license-authority:
    build:
      context: .
      dockerfile: services/license-authority/Dockerfile
    image: lr-platform-license-authority:latest
    container_name: lr-license-authority
    restart: unless-stopped
    environment:
      MONGODB_URL: ${MONGODB_URL:?MONGODB_URL is required}
      SUPER_ADMIN_MONGODB_DATABASE: ${SUPER_ADMIN_MONGODB_DATABASE:-test}
      SUPER_ADMIN_LICENSE_COLLECTION: ${SUPER_ADMIN_LICENSE_COLLECTION:-lr_license_keys}
    expose:
      - "8005"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  web-backend:
    build:
      context: .
      dockerfile: services/web-backend/Dockerfile
    image: lr-platform-web-backend:latest
    container_name: lr-web-backend
    restart: unless-stopped
    environment:
      MONGODB_URL: ${MONGODB_URL:?MONGODB_URL is required}
      MONGODB_DATABASE: ${MONGODB_DATABASE:?MONGODB_DATABASE is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-${SECRET_KEY}}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      LICENSE_VALIDATION_URL: ${LICENSE_VALIDATION_URL:?LICENSE_VALIDATION_URL is required}
      LICENSE_VALIDATION_TIMEOUT_SECONDS: ${LICENSE_VALIDATION_TIMEOUT_SECONDS:-10}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      SOCKETIO_CORS_ORIGINS: ${SOCKETIO_CORS_ORIGINS:-${CORS_ORIGINS}}
      SOCKETIO_MESSAGE_QUEUE: ${SOCKETIO_MESSAGE_QUEUE:-redis://redis:6379/0}
      SOCKETIO_ASYNC_MODE: ${SOCKETIO_ASYNC_MODE:-gevent}
      SOCKETIO_WORKER_CONNECTIONS: ${SOCKETIO_WORKER_CONNECTIONS:-5000}
      AGENT_PRESENCE_REDIS_URL: ${AGENT_PRESENCE_REDIS_URL:-redis://redis:6379/2}
      AGENT_PRESENCE_TTL_SECONDS: ${AGENT_PRESENCE_TTL_SECONDS:-75}
      AGENT_COMMAND_TIMEOUT_SECONDS: ${AGENT_COMMAND_TIMEOUT_SECONDS:-45}
      AGENT_REQUIRE_MACHINE_BINDING: ${AGENT_REQUIRE_MACHINE_BINDING:-true}
      MONGODB_MAX_POOL_SIZE: ${MONGODB_MAX_POOL_SIZE:-200}
      MONGODB_MIN_POOL_SIZE: ${MONGODB_MIN_POOL_SIZE:-10}
      GUACAMOLE_TOKEN_CACHE_SECONDS: ${GUACAMOLE_TOKEN_CACHE_SECONDS:-300}
      REMOTEAPP_BROWSER_LAUNCH_TTL_SECONDS: ${REMOTEAPP_BROWSER_LAUNCH_TTL_SECONDS:-120}
      GUACAMOLE_HTTP_POOL_SIZE: ${GUACAMOLE_HTTP_POOL_SIZE:-100}
      GUACAMOLE_VISUAL_QUALITY: ${GUACAMOLE_VISUAL_QUALITY:-balanced}
      GUACAMOLE_ENABLE_PRINTING: ${GUACAMOLE_ENABLE_PRINTING:-true}
      GUACAMOLE_PRINTER_NAME: ${GUACAMOLE_PRINTER_NAME:-LR Remote Printer}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      LR_SERVER_URL: ${LR_SERVER_URL:-${WEB_BACKEND_PUBLIC_URL:-http://localhost:8004}}
      LR_BACKEND_URL: ${LR_BACKEND_URL:-${WEB_BACKEND_PUBLIC_URL:-http://localhost:8004}}
      PORTAL_HOME_URL: ${PORTAL_HOME_URL:-/portal}
      GUACAMOLE_URL: ${GUACAMOLE_URL:-http://guacamole:8080/guacamole}
      GUACAMOLE_PUBLIC_URL: ${GUACAMOLE_PUBLIC_URL:-http://localhost:8080/guacamole}
      GUACAMOLE_USER: ${GUACAMOLE_USER:?GUACAMOLE_USER is required}
      GUACAMOLE_PASSWORD: ${GUACAMOLE_PASSWORD:?GUACAMOLE_PASSWORD is required}
      GUACAMOLE_DATA_SOURCE: ${GUACAMOLE_DATA_SOURCE:-mysql}
    ports:
      - "${WEB_BACKEND_PORT:-8004}:8004"
    expose:
      - "8004"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - ./backend/static:/app/backend/static
      - ./instance/portal_customization_assets:/app/instance/portal_customization_assets
    depends_on:
      redis:
        condition: service_healthy
      license-authority:
        condition: service_healthy
      guacamole:
        condition: service_started

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    image: lr-platform-auth-service:latest
    container_name: lr-auth-service
    restart: unless-stopped
    environment:
      MONGODB_URL: ${MONGODB_URL:?MONGODB_URL is required}
      MONGODB_DATABASE: ${MONGODB_DATABASE:?MONGODB_DATABASE is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-${SECRET_KEY}}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
    expose:
      - "8001"

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    image: lr-platform-user-service:latest
    container_name: lr-user-service
    restart: unless-stopped
    environment:
      MONGODB_URL: ${MONGODB_URL:?MONGODB_URL is required}
      MONGODB_DATABASE: ${MONGODB_DATABASE:?MONGODB_DATABASE is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-${SECRET_KEY}}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
    expose:
      - "8002"

volumes:
  guac-db-data:
